# Lint, house-style check and the full test suite (incl. local Spark tests) on every push and
# pull request. No cloud credentials: nothing here talks to Azure or Fabric.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (Python 3.11 + Runtime 1.3 aligned libraries)
        run: uv sync --all-groups --frozen
      - name: Lint
        run: uv run ruff check .
      - name: No em or en dashes
        run: uv run python scripts/check_text.py
      - name: Tests
        run: uv run pytest -q
      - name: Fabric definitions render offline
        run: |
          uv build --wheel --out-dir dist
          uv run python infra/fabric/render.py --dry-run
      - name: SQL loader dry run
        run: uv run python scripts/load_sql.py --dry-run
