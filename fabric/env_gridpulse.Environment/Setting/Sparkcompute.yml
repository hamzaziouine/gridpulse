# Spark compute of env_gridpulse (Fabric environment definition part Setting/Sparkcompute.yml).
# runtime_version 1.3 = Spark 3.5 + Python 3.11, the runtime the code and the wheel target (without
# this file Fabric picks the default runtime, 2.0 on 2026-11-23, and the wheel install fails).
# Small footprint on purpose: the capacity is a shared FTL4 trial. No instance_pool_id = starter pool.
enable_native_execution_engine: false
driver_cores: 4
driver_memory: 28g
executor_cores: 4
executor_memory: 28g
dynamic_executor_allocation:
  enabled: true
  min_executors: 1
  max_executors: 2
runtime_version: 1.3
