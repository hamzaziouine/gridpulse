[project]
name = "gridpulse"
version = "0.2.0"
description = "GridPulse: Ontario electricity demand and smart-meter analytics on Microsoft Fabric (UIR Cloud CDDA project 2026-2027)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hamza Ziouine" }, { name = "Mohamed Nacir" }, { name = "Omar Mounabbih" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    # Only what the Fabric notebooks import from the wheel. Bounds follow Fabric Runtime 1.3
    # (Spark 3.5, Python 3.11, pandas 2.x, numpy 1.26) so pip never upgrades the runtime's copies.
    "numpy>=1.26,<2",
    "pandas>=2.1,<2.3",
    "holidays>=0.50",
    "lightgbm>=4.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
# Azure SQL driver for scripts/load_sql.py (bundles its own ODBC driver, no admin install).
sql = [
    "mssql-python>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "sqlparse>=0.6.1",
]
# Laptop-side tools: data pulls, reference data, simulator, Key Vault access, local Parquet store.
tools = [
    "pyarrow>=14,<18",
    "httpx>=0.28",
    "tenacity>=8.5",
    "faker>=30",
    "azure-identity>=1.19",
    "azure-keyvault-secrets>=4.9",
    "azure-eventhub>=5.12",
]
ml = [
    "matplotlib>=3.8,<3.10",
    "mlflow-skinny>=2.12,<3",
]
# Local Spark for the notebook tests (needs a JDK 17 in JAVA_HOME).
spark = [
    "pyspark>=3.5.3,<3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridpulse"]

[tool.uv]
default-groups = ["dev", "tools", "ml", "spark"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]
# `F` / `T` are the usual aliases for pyspark.sql.functions / types.
ignore = ["N812"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"realtime/**" = ["S311"]
"scripts/**" = ["S311"]
# Fabric notebooks: `spark`/`display` are session globals, imports follow the parameters cell,
# `store` is probed to detect a local run, and parameter names like *_secret_name hold no secret.
"fabric/**" = ["E402", "F821", "B018", "S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # PySpark 3.5 internals on pandas 2.2 / Python 3.11, not our code
    "ignore::DeprecationWarning:pyspark.*",
    "ignore::DeprecationWarning:distutils.*",
]
