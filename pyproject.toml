[project]
name = "gridpulse"
version = "0.1.0"
description = "GridPulse: Ontario electricity demand and smart-meter analytics on Microsoft Fabric (UIR Cloud CDDA project 2026-2027)."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Hamza Ziouine" }, { name = "Mohamed Nacir" }, { name = "Omar Mounabbih" }]
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=17",
    "httpx>=0.28",
    "tenacity>=8.5",
    "tzdata>=2024.1",
    "holidays>=0.60",
    "lightgbm>=4.5",
    "faker>=30",
    "azure-identity>=1.19",
    "azure-keyvault-secrets>=4.9",
    "azure-eventhub>=5.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "sqlparse>=0.6.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gridpulse"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]
"realtime/**" = ["S311"]
"scripts/**" = ["S311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
